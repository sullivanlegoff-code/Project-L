name: Publier Prairie de lapins

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prairie-production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prairie-lapins-prototype
    env:
      VITE_BUILD_REVISION: ${{ github.sha }}
    steps:
      - name: Lire la branche de livraison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Installer Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prairie-lapins-prototype/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Tester les règles et l'interface
        run: npm test
      - name: Vérifier TypeScript
        run: npm run typecheck
      - name: Construire et contrôler le jeu normal et le laboratoire
        run: npm run build:pages -- "$RUNNER_TEMP/prairie-pages"
      # Frozen experimental sources; the normal and laboratory sources above
      # stay on production. Always ship all four routes in ONE Pages artifact.
      - name: Lire les sources figées de la prévisualisation des comptes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 3e70d9e8cbe9228c63c73db007fff199199d6470
          path: accounts-preview-source
          persist-credentials: false
      - name: Installer et tester la prévisualisation séparée
        working-directory: accounts-preview-source/prairie-lapins-prototype
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Construire la prévisualisation avec sa propre révision
        working-directory: accounts-preview-source/prairie-lapins-prototype
        env:
          VITE_BUILD_REVISION: 3e70d9e8cbe9228c63c73db007fff199199d6470
          # Public browser settings only, and ONLY for the separate preview.
          VITE_SUPABASE_URL: ${{ vars.PRAIRIE_PREVIEW_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRAIRIE_PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build:account-preview -- --outDir "$RUNNER_TEMP/prairie-pages/preview/accounts" --emptyOutDir
          printf '%s\n' "$VITE_BUILD_REVISION" > "$RUNNER_TEMP/prairie-pages/preview/accounts/build-revision.txt"
          node scripts/verify-production.mjs "$RUNNER_TEMP/prairie-pages/preview/accounts" /Project-L/preview/accounts/
      - name: Lire les sources figées de la prévisualisation Décorations v5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 85fe255ec8e7e65213cd570f91f5bb1fe66a30d7
          path: decorations-preview-source
          persist-credentials: false
      - name: Installer et vérifier les décorations séparées
        working-directory: decorations-preview-source/prairie-lapins-prototype
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: Construire Décorations sans client de comptes
        working-directory: decorations-preview-source/prairie-lapins-prototype
        env:
          VITE_BUILD_REVISION: 85fe255ec8e7e65213cd570f91f5bb1fe66a30d7
        run: |
          npm run build:decorations -- --outDir "$RUNNER_TEMP/prairie-pages/preview/decorations" --emptyOutDir
          printf '%s\n' "$VITE_BUILD_REVISION" > "$RUNNER_TEMP/prairie-pages/preview/decorations/build-revision.txt"
          node scripts/verify-decorations.mjs "$RUNNER_TEMP/prairie-pages/preview/decorations"
      - name: Vérifier les quatre routes, formats et révisions avant publication
        run: node scripts/verify-land-integration.mjs "$RUNNER_TEMP/prairie-pages" "$VITE_BUILD_REVISION" 85fe255ec8e7e65213cd570f91f5bb1fe66a30d7
      - name: Préparer uniquement les fichiers du site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/prairie-pages

  deploy:
    if: github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Vérifier la configuration Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publier le site HTTPS
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Lire le contrôle de révision public
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/scripts
            prairie-lapins-prototype/docs
          persist-credentials: false
      - name: Vérifier les quatre révisions et fonctionnalités réellement servies
        env:
          STABLE_REVISION: ${{ github.sha }}
          ACCOUNTS_REVISION: 3e70d9e8cbe9228c63c73db007fff199199d6470
          DECORATIONS_REVISION: 85fe255ec8e7e65213cd570f91f5bb1fe66a30d7
        run: node .github/scripts/verify-published.mjs
      - name: Installer le navigateur de contrôle public
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" playwright@1.56.1
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Vérifier les interactions normales et le laboratoire publiés
        env:
          NODE_PATH: ${{ runner.temp }}/browser-check/node_modules
          PRAIRIE_CAPTURE_DIR: ${{ runner.temp }}/public-browser-proof
          PRAIRIE_CHROMIUM: playwright
        run: |
          node prairie-lapins-prototype/docs/production-browser-check.cjs https://sullivanlegoff-code.github.io/Project-L/ "${{ github.sha }}"
          node prairie-lapins-prototype/docs/laboratory-browser-check.cjs https://sullivanlegoff-code.github.io/Project-L/ "${{ github.sha }}"
      - name: Conserver les preuves publiques
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-v6-validation-${{ github.sha }}
          path: |
            published-revisions.json
            ${{ runner.temp }}/public-browser-proof
          retention-days: 30
