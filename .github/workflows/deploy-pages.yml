name: Publier Prairie de lapins

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prairie-production-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prairie-lapins-prototype
    env:
      VITE_BUILD_REVISION: ${{ github.sha }}
    steps:
      - name: Lire la branche de livraison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prairie-lapins-prototype/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Tester les règles et l'interface
        run: npm test
      - name: Vérifier TypeScript
        run: npm run typecheck
      - name: Construire le jeu pour GitHub Pages
        run: |
          npm run build -- --base=/Project-L/ --outDir "$RUNNER_TEMP/prairie-pages"
          printf '%s\n' "$VITE_BUILD_REVISION" > "$RUNNER_TEMP/prairie-pages/build-revision.txt"
          touch "$RUNNER_TEMP/prairie-pages/.nojekyll"
          node scripts/verify-production.mjs "$RUNNER_TEMP/prairie-pages" /Project-L/
      - name: Préparer uniquement les fichiers du site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/prairie-pages

  deploy:
    if: github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Vérifier la configuration Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publier le site HTTPS
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
